# Le projet Xcode est GÉNÉRÉ à partir de ce fichier (XcodeGen) : il n'est jamais écrit à la main ni
# commité. Une app de plus = une cible de plus ici, plus son dossier dans Apps/ et Extensions/.
name: Juclairian
options:
  bundleIdPrefix: com.juclairian
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  # ── ORLA ────────────────────────────────────────────────────────────────────────────────────
  Orla:
    type: application
    platform: iOS
    sources:
      - Commun/Coquille
      - Commun/Web
      - Apps/Orla
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juclairian.orla
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Plists/Orla-Info.plist
      properties:
        CFBundleDisplayName: Orla
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # L'adresse que la coquille ouvre. Tout le reste de l'app vient du site.
        JuclairianDepart: https://juclairian.com/orla/
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Sans ces phrases, la page qui demande une photo ou la position ferait planter l'app.
        NSCameraUsageDescription: Pour prendre une photo et l'ajouter à Orla.
        NSLocationWhenInUseUsageDescription: Pour proposer les lieux autour de vous.
        # Aucun chiffrement propre à l'app : TestFlight ne pose plus la question à chaque version.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: OrlaPartage
    scheme: {}

  OrlaPartage:
    type: app-extension
    platform: iOS
    sources:
      - Commun/Partage
      - Commun/Web
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juclairian.orla.partage
    info:
      path: Plists/OrlaPartage-Info.plist
      properties:
        CFBundleDisplayName: Orla
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # La page d'Orla qui reçoit le partage ; {url} est remplacé par le lien partagé.
        JuclairianPartage: https://juclairian.com/orla/ajouter-lieu/?url={url}
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PartageController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
