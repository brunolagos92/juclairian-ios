# Le projet Xcode est GÉNÉRÉ à partir de ce fichier (XcodeGen) : il n'est jamais écrit à la main ni
# commité. Une app de plus = une cible de plus ici, plus son dossier dans Apps/ et Extensions/.
name: Juclairian
options:
  bundleIdPrefix: com.juclairian
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    # L'équipe du compte développeur de Bruno (developer.apple.com → Détails de l'abonnement). Pas un secret.
    DEVELOPMENT_TEAM: DKUFT47Y46
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  # ── ORLA ────────────────────────────────────────────────────────────────────────────────────
  Orla:
    type: application
    platform: iOS
    sources:
      - Commun/Coquille
      - Commun/Web
      - Apps/Orla
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juclairian.orla
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # L'envoi dans TestFlight signe à la main, avec le profil que fastlane match a créé
      # (fastlane/Fastfile). En Debug, Xcode garde la main.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.juclairian.orla
    info:
      path: Plists/Orla-Info.plist
      properties:
        CFBundleDisplayName: Orla
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # L'adresse que la coquille ouvre. Tout le reste de l'app vient du site.
        JuclairianDepart: https://juclairian.com/orla/
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Sans ces phrases, la page qui demande une photo ou la position ferait planter l'app.
        NSCameraUsageDescription: Pour prendre une photo et l'ajouter à Orla.
        NSLocationWhenInUseUsageDescription: Pour proposer les lieux autour de vous.
        # Aucun chiffrement propre à l'app : TestFlight ne pose plus la question à chaque version.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: OrlaPartage
    scheme: {}

  OrlaPartage:
    type: app-extension
    platform: iOS
    sources:
      - Commun/Partage
      - Commun/Web
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juclairian.orla.partage
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.juclairian.orla.partage
    info:
      path: Plists/OrlaPartage-Info.plist
      properties:
        CFBundleDisplayName: Orla
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # La page d'Orla qui reçoit le partage ; {url} est remplacé par le lien partagé, {texte} par le
        # texte qui l'accompagne (le titre, souvent — un livre Amazon).
        JuclairianPartage: https://juclairian.com/orla/ajouter-lieu/?url={url}&texte={texte}
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PartageController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  # ── VELA ────────────────────────────────────────────────────────────────────────────────────
  # Les voyages. La même coquille et la même extension qu'Orla : seuls l'icône, les adresses et les
  # identifiants changent. ⚠️ Sa fiche App Store Connect (« Vela Juclairian ») se crée À LA MAIN, une
  # fois — voir CLAUDE.md.
  Vela:
    type: application
    platform: iOS
    sources:
      - Commun/Coquille
      - Commun/Web
      - Apps/Vela
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juclairian.vela
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.juclairian.vela
    info:
      path: Plists/Vela-Info.plist
      properties:
        CFBundleDisplayName: Vela
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # L'adresse que la coquille ouvre : la liste des voyages (« / » y renvoie de toute façon).
        JuclairianDepart: https://juclairian.com/voyages/
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Sans ces phrases, la page qui demande une photo ou la position ferait planter l'app.
        NSCameraUsageDescription: Pour prendre une photo et l'ajouter au voyage.
        NSLocationWhenInUseUsageDescription: Pour vous situer sur la carte du voyage.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: VelaPartage
    scheme: {}

  VelaPartage:
    type: app-extension
    platform: iOS
    sources:
      - Commun/Partage
      - Commun/Web
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juclairian.vela.partage
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.juclairian.vela.partage
    info:
      path: Plists/VelaPartage-Info.plist
      properties:
        CFBundleDisplayName: Vela
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # La page de Vela qui reçoit un lieu Google Maps : choisir le voyage, puis la Réserve ou la journée.
        JuclairianPartage: https://juclairian.com/ajouter-lieu/?url={url}&texte={texte}
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PartageController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  # ── HORA ────────────────────────────────────────────────────────────────────────────────────
  # Les échéances. La même coquille, SANS extension de partage : rien ne se partage vers Hora (pas de page
  # qui reçoive un lien). ⚠️ Sa fiche App Store Connect (« Hora Juclairian ») se crée À LA MAIN, une fois.
  Hora:
    type: application
    platform: iOS
    sources:
      - Commun/Coquille
      - Commun/Web
      - Apps/Hora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juclairian.hora
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.juclairian.hora
    info:
      path: Plists/Hora-Info.plist
      properties:
        CFBundleDisplayName: Hora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # L'adresse que la coquille ouvre : les échéances. Ni photo ni position : aucune page de Hora n'en demande.
        JuclairianDepart: https://juclairian.com/echeances/
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    scheme: {}
