# Le projet Xcode est GÉNÉRÉ à partir de ce fichier (XcodeGen) : il n'est jamais écrit à la main ni
# commité. Une app de plus = une cible de plus ici, plus son dossier dans Apps/ et Extensions/.
#
# ⚠️ TOUTE APP PEUT RECEVOIR DES NOTIFICATIONS (« la possibilité pour toutes les apps. Après j'utilise ou pas »,
# Bruno, 28/10/2026) : chacune porte le droit `aps-environment: production` (celui de TestFlight) et la clé
# `JuclairianNotifications` ; le Fastfile déclare la capacité chez Apple. Une app neuve fait de même.
name: Juclairian
options:
  bundleIdPrefix: com.juclairian
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    # L'équipe du compte développeur de Bruno (developer.apple.com → Détails de l'abonnement). Pas un secret.
    DEVELOPMENT_TEAM: DKUFT47Y46
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  # ── ORLA ────────────────────────────────────────────────────────────────────────────────────
  Orla:
    type: application
    platform: iOS
    sources:
      - Commun/Coquille
      - Commun/Web
      - Apps/Orla
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juclairian.orla
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # L'envoi dans TestFlight signe à la main, avec le profil que fastlane match a créé
      # (fastlane/Fastfile). En Debug, Xcode garde la main.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.juclairian.orla
    entitlements:
      path: Plists/Orla.entitlements
      properties:
        aps-environment: production
    info:
      path: Plists/Orla-Info.plist
      properties:
        CFBundleDisplayName: Orla
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # L'adresse que la coquille ouvre. Tout le reste de l'app vient du site.
        JuclairianDepart: https://juclairian.com/orla/
        JuclairianNotifications: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Sans ces phrases, la page qui demande une photo ou la position ferait planter l'app.
        NSCameraUsageDescription: Pour prendre une photo et l'ajouter à Orla.
        NSLocationWhenInUseUsageDescription: Pour proposer les lieux autour de vous.
        # Aucun chiffrement propre à l'app : TestFlight ne pose plus la question à chaque version.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: OrlaPartage
    scheme: {}

  OrlaPartage:
    type: app-extension
    platform: iOS
    sources:
      - Commun/Partage
      - Commun/Web
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juclairian.orla.partage
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.juclairian.orla.partage
    info:
      path: Plists/OrlaPartage-Info.plist
      properties:
        CFBundleDisplayName: Orla
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # La page d'Orla qui reçoit le partage ; {url} est remplacé par le lien partagé, {texte} par le
        # texte qui l'accompagne (le titre, souvent — un livre Amazon).
        JuclairianPartage: https://juclairian.com/orla/ajouter-lieu/?url={url}&texte={texte}
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PartageController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  # ── VELA ────────────────────────────────────────────────────────────────────────────────────
  # Les voyages. La même coquille et la même extension qu'Orla : seuls l'icône, les adresses et les
  # identifiants changent. ⚠️ Sa fiche App Store Connect (« Vela Juclairian ») se crée À LA MAIN, une
  # fois — voir CLAUDE.md.
  Vela:
    type: application
    platform: iOS
    sources:
      - Commun/Coquille
      - Commun/Web
      - Apps/Vela
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juclairian.vela
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.juclairian.vela
    entitlements:
      path: Plists/Vela.entitlements
      properties:
        aps-environment: production
    info:
      path: Plists/Vela-Info.plist
      properties:
        CFBundleDisplayName: Vela
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # L'adresse que la coquille ouvre : la liste des voyages (« / » y renvoie de toute façon).
        JuclairianDepart: https://juclairian.com/voyages/
        JuclairianNotifications: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Sans ces phrases, la page qui demande une photo ou la position ferait planter l'app.
        NSCameraUsageDescription: Pour prendre une photo et l'ajouter au voyage.
        NSLocationWhenInUseUsageDescription: Pour vous situer sur la carte du voyage.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: VelaPartage
    scheme: {}

  VelaPartage:
    type: app-extension
    platform: iOS
    sources:
      - Commun/Partage
      - Commun/Web
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juclairian.vela.partage
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.juclairian.vela.partage
    info:
      path: Plists/VelaPartage-Info.plist
      properties:
        CFBundleDisplayName: Vela
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # La page de Vela qui reçoit un lieu Google Maps : choisir le voyage, puis la Réserve ou la journée.
        JuclairianPartage: https://juclairian.com/ajouter-lieu/?url={url}&texte={texte}
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PartageController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  # ── HORA ────────────────────────────────────────────────────────────────────────────────────
  # Les échéances. La même coquille, SANS extension de partage : rien ne se partage vers Hora (pas de page
  # qui reçoive un lien). ⚠️ Sa fiche App Store Connect (« Hora Juclairian ») se crée À LA MAIN, une fois.
  Hora:
    type: application
    platform: iOS
    sources:
      - Commun/Coquille
      - Commun/Web
      - Apps/Hora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juclairian.hora
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.juclairian.hora
    entitlements:
      path: Plists/Hora.entitlements
      properties:
        aps-environment: production
    info:
      path: Plists/Hora-Info.plist
      properties:
        CFBundleDisplayName: Hora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # L'adresse que la coquille ouvre : les échéances. Ni photo ni position : aucune page de Hora n'en demande.
        JuclairianDepart: https://juclairian.com/echeances/
        JuclairianNotifications: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    scheme: {}

  # ── NUMERIA ─────────────────────────────────────────────────────────────────────────────────
  # Les comptes. Son propre site (numeria.juclairian.com, dépôt juclairian-app), la même coquille, SANS
  # extension : rien ne se partage vers Numeria. Son import se fait par un fichier CSV (le sélecteur de
  # fichiers d'iOS, sans appareil photo) : aucune phrase de permission. ⚠️ Fiche App Store Connect
  # (« Numeria Juclairian ») créée À LA MAIN, une fois.
  Numeria:
    type: application
    platform: iOS
    sources:
      - Commun/Coquille
      - Commun/Web
      - Apps/Numeria
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juclairian.numeria
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.juclairian.numeria
    entitlements:
      path: Plists/Numeria.entitlements
      properties:
        aps-environment: production
    info:
      path: Plists/Numeria-Info.plist
      properties:
        CFBundleDisplayName: Numeria
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        JuclairianDepart: https://numeria.juclairian.com/
        JuclairianNotifications: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    scheme: {}

  # ── ELECTRA ─────────────────────────────────────────────────────────────────────────────────
  # Elle ne tourne QUE sur le Mac de Bruno (« elle ne peut tourner qu'en local ») : l'iPhone la joint par
  # Tailscale, à l'adresse du Mac sur son réseau privé, en http. D'où l'exception ATS, limitée au contenu
  # web. La même coquille, sans extension. ⚠️ Fiche App Store Connect (« Electra Juclairian ») À LA MAIN.
  Electra:
    type: application
    platform: iOS
    sources:
      - Commun/Coquille
      - Commun/Web
      - Apps/Electra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juclairian.electra
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.juclairian.electra
    entitlements:
      path: Plists/Electra.entitlements
      properties:
        aps-environment: production
    info:
      path: Plists/Electra-Info.plist
      properties:
        CFBundleDisplayName: Electra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # L'adresse Tailscale du Mac (100.x, stable tant que le Mac reste dans le réseau privé), port d'Electra.
        JuclairianDepart: http://100.112.244.82:8321/
        # La coquille demande l'autorisation et remet le jeton à la page (Commun/Coquille/Notifications.swift).
        JuclairianNotifications: true
        # http, et une adresse IP : sans cette exception, la vue web refuserait la page.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    scheme: {}
