# Construire les apps, et les envoyer dans TestFlight quand la clé d'API est posée.
#
# Deux étapes, et la seconde ne tourne que si les secrets existent :
#   1. COMPILER pour le simulateur, sans signature : prouve que le code se construit. Sans compte.
#   2. SIGNER et ENVOYER dans TestFlight : fastlane (fastlane/Fastfile). `match` garde le certificat
#      de distribution et les profils App Store, chiffrés, dans la branche `signature` de ce dépôt ;
#      le numéro de build est celui de l'exécution (il doit croître à chaque envoi).
#
# Réglages du dépôt (Settings → Secrets and variables → Actions) :
#   secrets   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (le contenu du fichier .p8)
# L'identifiant d'équipe n'est pas secret : il est écrit ici et dans project.yml (DEVELOPMENT_TEAM).
# Le mot de passe de la branche `signature` est TIRÉ de la clé (son empreinte) : aucun secret de plus.
# ⚠️ Changer de clé d'API rend donc la branche illisible : la supprimer, la construction suivante
# recrée certificat et profils.
#
# ⚠️ Les minutes macOS de GitHub comptent DIX fois sur un dépôt privé : le .md ne relance rien.
name: Construire

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
  # ⚠️ Une version TestFlight EXPIRE au bout de 90 jours : sans push pendant trois mois, l'app ne
  # s'ouvrirait plus. Une reconstruction le 1er des mois impairs garde toujours une version vivante.
  schedule:
    - cron: "17 3 1 */2 *"

jobs:
  apps:
    # ⚠️ macos-26, pour Xcode 26 : depuis 2026, Apple refuse tout envoi construit avec un SDK plus
    # ancien (essai 9, signé et prêt, rejeté : « built with the iOS 18.5 SDK … must be built with
    # the iOS 26 SDK or later »). macos-15 donnait Xcode 16.4.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write # match dépose certificat et profils dans la branche `signature`
    env:
      APPLE_TEAM_ID: DKUFT47Y46
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5

      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compiler (simulateur, sans signature)
        run: |
          set -o pipefail
          for app in Orla Vela Hora; do
            xcodebuild -project Juclairian.xcodeproj -scheme "$app" \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO build | tail -n 20
          done

      - name: Signer et envoyer dans TestFlight
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != '' && env.APPLE_TEAM_ID != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
        run: |
          set -o pipefail
          CLE="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # ⚠️ LA CLÉ EST RECONSTRUITE, PAS RECOPIÉE. Collée dans le secret, elle avait perdu sa forme
          # (premier envoi : « invalidPEMDocument ») — sauts de ligne fondus, en-têtes absents ou
          # espaces parasites. On n'en garde que le corps en base64, et on le remet en PEM exact :
          # en-tête, lignes de 64 caractères, pied. Une clé bien collée en ressort identique.
          printf '%s' "$ASC_KEY_P8" | python3 -c '
          import re, sys
          t = sys.stdin.read()
          t = re.sub(r"-----(BEGIN|END)[^-]*-----", "", t)
          corps = re.sub(r"[^A-Za-z0-9+/=]", "", t)
          if len(corps) < 100:
              sys.exit("ASC_KEY_P8 : le secret ne contient pas de clé (%d caractères utiles)" % len(corps))
          lignes = [corps[i:i + 64] for i in range(0, len(corps), 64)]
          print("-----BEGIN PRIVATE KEY-----\n" + "\n".join(lignes) + "\n-----END PRIVATE KEY-----")
          ' > "$CLE"
          # ⚠️ Xcode 16 CHERCHE les profils dans UserData/Provisioning Profiles mais les ÉCRIT ailleurs :
          # le profil était bien créé chez Apple, puis introuvable (« Build input file cannot be found
          # … .mobileprovision »), que le dossier existe ou non (essais 4 et 5). Le nouveau dossier
          # devient un renvoi vers l'ancien : les deux chemins mènent au même endroit.
          ANCIEN="$HOME/Library/MobileDevice/Provisioning Profiles"
          NOUVEAU="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$ANCIEN" "$(dirname "$NOUVEAU")"
          rm -rf "$NOUVEAU"
          ln -s "$ANCIEN" "$NOUVEAU"
          # En cas d'échec, on relève OÙ sont les profils au lieu de le supposer.
          releve() {
            echo "── Profils présents sur la machine :"
            find "$HOME/Library" -name '*.mobileprovision' 2>/dev/null || true
            ls -la "$ANCIEN" "$NOUVEAU" 2>&1 || true
          }
          trap 'releve' ERR
          export ASC_KEY_PATH="$CLE"
          export MATCH_PASSWORD="$(shasum -a 256 "$CLE" | cut -c1-64)"
          echo "::add-mask::$MATCH_PASSWORD"
          command -v fastlane >/dev/null || brew install fastlane
          fastlane ios testflight
          rm -f "$CLE"
